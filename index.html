<!DOCTYPE html>
<html lang="pt-BR">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workshop - Por que o amor não é o suficiente</title>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f111a;
            color: #e2e8f0;
            line-height: 1.6;
        }

        .container {
            width: 90%;
            max-width: 650px;
            margin: 0 auto;
            padding: 40px 0;
        }

        /* Header / Pain Section */
        header {
            text-align: center;
            padding: 20px 0;
        }

        .badge {

            color: #fff;
            padding: 6px 16px;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-block;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            line-height: 1.25;
            color: #ffffff;
            margin-bottom: 24px;
        }

        h1 span {
            color: #ff3366;
        }

        .pain-points {
            background: #161925;
            border-left: 4px solid #ff3366;
            padding: 20px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 30px;
            text-align: left;
        }

        .pain-points p {
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: #cbd5e1;
        }

        .pain-points p:last-child {
            margin-bottom: 0;
        }

        /* Offer Details */
        .offer-box {
            background: linear-gradient(145deg, #1e2235, #161925);
            border: 1px solid #2e344d;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            margin-bottom: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .info-list {
            list-style: none;
            text-align: left;
            margin: 20px auto;
            max-width: 400px;
        }

        .info-list li {
            margin-bottom: 12px;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            color: #94a3b8;
        }

        .info-list li::before {
            content: "✓";
            color: #10b981;
            font-weight: bold;
            margin-right: 12px;
            font-size: 1.2rem;
        }

        .price-tag {
            margin: 25px 0 15px 0;
        }

        .price-tag .old-price {
            text-decoration: line-through;
            color: #64748b;
            font-size: 1rem;
            display: block;
        }

        .price-tag .current-price {
            font-size: 2.8rem;
            font-weight: 800;
            color: #ffffff;
            display: block;
            line-height: 1;
        }

        /* CTA Button */
        .cta-button {
            display: block;
            background: #10b981;
            color: #ffffff;
            text-decoration: none;
            padding: 18px 30px;
            font-size: 1.25rem;
            font-weight: bold;
            border-radius: 8px;
            box-shadow: 0 5px 20px rgba(16, 185, 129, 0.3);
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .cta-button:hover {
            background: #059669;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4);
        }
